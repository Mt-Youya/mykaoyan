name: 手动部署

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: 构建 web 与 api 镜像
        shell: bash
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker build --file deploy/Dockerfile --target web --tag "mykaoyan-web:$GITHUB_SHA" .
          docker build --file deploy/Dockerfile --target api --tag "mykaoyan-api:$GITHUB_SHA" .
      - name: 通过 SSH 上传镜像并更新 ECS compose
        timeout-minutes: 30
        shell: bash
        run: |
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_SSH_KEY:?}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mykaoyan
          chmod 600 ~/.ssh/mykaoyan
          # 主机公钥在部署时抓取（TOFU），不依赖预先保存的 DEPLOY_KNOWN_HOSTS。
          for attempt in {1..10}; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            sleep 3
          done
          [ -s ~/.ssh/known_hosts ] || { echo "无法获取 $DEPLOY_HOST 的 SSH 主机密钥" >&2; exit 1; }
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/mykaoyan "$target" "mkdir -p /opt/mykaoyan/deploy"
          scp -i ~/.ssh/mykaoyan deploy/compose.yaml deploy/Caddyfile "$target:/opt/mykaoyan/deploy/"
          set -o pipefail
          docker save "mykaoyan-web:$GITHUB_SHA" "mykaoyan-api:$GITHUB_SHA" | gzip -1 | ssh -i ~/.ssh/mykaoyan "$target" "gunzip -c | docker load"
          ssh -i ~/.ssh/mykaoyan "$target" "bash -s -- mykaoyan-web:$GITHUB_SHA mykaoyan-api:$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/mykaoyan
          printf 'WEB_IMAGE=%s\nAPI_IMAGE=%s\n' "$1" "$2" > .env.images
          docker compose --env-file .env.images -f deploy/compose.yaml up -d --remove-orphans
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.images -f deploy/compose.yaml exec -T api \
              node -e "fetch('http://127.0.0.1:3001/api/health').then((r) => { if (!r.ok) process.exit(1); return r.json() }).then((d) => { if (d.status !== 'ok' || d.database !== 'connected') process.exit(1); console.log('API 容器健康检查通过') }).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then echo "API 容器健康检查失败" >&2; exit 1; fi
            sleep 2
          done
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE
      - name: 部署后公网冒烟检查（DNS 未就绪时记录失败）
        continue-on-error: true
        shell: bash
        run: |
          for attempt in {1..12}; do
            if node deploy/smoke.mjs https://mykaoyan.cn; then exit 0; fi
            sleep 5
          done
          exit 1
