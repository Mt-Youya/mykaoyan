name: 诊断 ECS 容器

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: 读取 compose 状态、环境变量名与容器日志
        shell: bash
        run: |
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_SSH_KEY:?}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mykaoyan
          chmod 600 ~/.ssh/mykaoyan
          for attempt in {1..10}; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            sleep 3
          done
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/mykaoyan "$target" "bash -s" <<'REMOTE'
          set -u
          echo "===== env keys (values hidden) ====="
          if [ -f /opt/mykaoyan-api/.env ]; then
            awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1}' /opt/mykaoyan-api/.env | sort
          else
            echo "NO /opt/mykaoyan-api/.env"
          fi
          echo "===== main compose ps ====="
          cd /opt/mykaoyan 2>/dev/null && docker compose --env-file .env.images -f deploy/compose.yaml ps -a 2>&1
          echo "===== api logs ====="
          docker logs --tail=40 deploy-api-1 2>&1
          echo "===== web local fetch ====="
          docker compose --env-file .env.images -f deploy/compose.yaml exec -T web node -e "fetch('http://127.0.0.1:3000/').then(async (r) => { console.log('status=' + r.status); const t = await r.text(); console.log('bytes=' + t.length) }).catch((e) => { console.error('fetch failed: ' + e.message); process.exit(1) })" 2>&1
          echo "===== web->api fetch ====="
          docker compose --env-file .env.images -f deploy/compose.yaml exec -T web node -e "fetch('http://api:3001/api/health').then(async (r) => { console.log('status=' + r.status); console.log((await r.text()).slice(0, 200)) }).catch((e) => { console.error('fetch failed: ' + e.message); process.exit(1) })" 2>&1
          echo "===== ports ====="
          ss -ltnp 2>/dev/null | grep -E ':80 |:443 |:3000|:3001' || true
          echo "===== disk ====="
          df -h / 2>&1 | tail -2
          REMOTE