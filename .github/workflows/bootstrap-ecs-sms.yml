name: 临时修复 ECS 短信配置

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: 写入占位短信配置并诊断数据库认证
        shell: bash
        run: |
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_SSH_KEY:?}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mykaoyan
          chmod 600 ~/.ssh/mykaoyan
          for attempt in {1..10}; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            sleep 3
          done
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/mykaoyan "$target" "bash -s" <<'REMOTE'
          set -uo pipefail
          cd /opt/mykaoyan-api || { echo "NO /opt/mykaoyan-api"; exit 1; }
          set_key() {
            key="$1"; val="$2"
            if grep -q "^$key=" .env; then sed -i "s|^$key=.*|$key=$val|" .env; else printf '\n%s=%s\n' "$key" "$val" >> .env; fi
          }
          set_key SMS_PROVIDER aliyun
          set_key ALIYUN_ACCESS_KEY_ID REPLACE_WITH_REAL_AK_ID
          set_key ALIYUN_ACCESS_KEY_SECRET REPLACE_WITH_REAL_AK_SECRET
          set_key ALIYUN_SMS_SIGN_NAME REPLACE_WITH_REAL_SIGN_NAME
          set_key ALIYUN_SMS_TEMPLATE_CODE REPLACE_WITH_REAL_TEMPLATE_CODE
          dburl=$(sed -n 's/^DATABASE_URL=//p' .env)
          echo "db user: $(printf '%s' "$dburl" | sed -E 's#^[a-z]+://([^:@/]+).*#\1#')"
          cd /opt/mykaoyan
          docker compose --env-file .env.images -f deploy/compose.yaml up -d 2>&1 || true
          sleep 5
          echo "===== container db query ====="
          docker compose --env-file .env.images -f deploy/compose.yaml exec -T api node -e "const postgres=require('postgres');const sql=postgres(process.env.DATABASE_URL,{max:1});sql.unsafe('select 1 as ok').then((r)=>console.log('db-query-ok '+JSON.stringify(r))).catch((e)=>console.log('db-query-error code='+(e.code||'')+' msg='+String(e.message).slice(0,300))).finally(()=>sql.end({timeout:1}))" < /dev/null 2>&1 || true
          echo "===== api logs ====="
          docker logs --tail=40 deploy-api-1 2>&1 || true
          echo "===== health ====="
          docker compose --env-file .env.images -f deploy/compose.yaml exec -T api node -e "fetch('http://127.0.0.1:3001/api/health').then(async (r)=>{console.log('status='+r.status);console.log((await r.text()).slice(0,200))})" < /dev/null 2>&1 || true
          REMOTE