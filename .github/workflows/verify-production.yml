name: 生产验收检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: 检查生产容器、试卷接口与页面
        shell: bash
        run: |
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_SSH_KEY:?}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mykaoyan
          chmod 600 ~/.ssh/mykaoyan
          for attempt in {1..10}; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then break; fi
            sleep 3
          done
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/mykaoyan "$target" "bash -s" <<'REMOTE'
          set -uo pipefail
          cd /opt/mykaoyan
          echo "===== containers ====="
          docker compose --env-file .env.images -f deploy/compose.yaml ps --format '{{.Service}} {{.Status}}' 2>&1
          echo "===== api endpoints ====="
          docker compose --env-file .env.images -f deploy/compose.yaml exec -T api node -e 'const base="http://127.0.0.1:3001/api";const get=async(p)=>{const r=await fetch(base+p);let b=null;try{b=await r.json()}catch{};return {status:r.status,body:b}};(async()=>{const health=await get("/health");const m=await get("/papers?subject=math2");const c=await get("/papers?subject=408");const slug=m.body?.[0]?.slug;const d=slug?await get("/papers/"+slug):null;const a=slug?await get("/papers/"+slug+"/answers"):null;const cm=slug?await get("/papers/"+slug+"/comments"):null;console.log(JSON.stringify({health,mCount:m.body?.length,cCount:c.body?.length,firstSlug:slug,detailKeys:d?Object.keys(d.body||{}):null,answersStatus:a?.status,commentsStatus:cm?.status,commentsKeys:cm?Object.keys(cm.body||{}):null}))})()' < /dev/null 2>&1
          echo "===== web pages ====="
          for path in /exams /community/papers /community/papers/new; do
            docker compose --env-file .env.images -f deploy/compose.yaml exec -T web node -e "fetch('http://127.0.0.1:3000$path').then(async(r)=>{const t=await r.text();console.log(JSON.stringify({path:'$path',status:r.status,bytes:t.length,hasTitle:t.includes('<title>')}))}).catch((e)=>{console.log(JSON.stringify({path:'$path',error:String(e)}))})" < /dev/null 2>&1
          done
          echo "===== disk ====="
          df -h / 2>&1 | tail -2
          REMOTE