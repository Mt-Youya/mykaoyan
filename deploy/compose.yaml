services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
  web:
    image: ${WEB_IMAGE:?必须指定前端镜像}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
  api:
    image: ${API_IMAGE:?必须指定后端镜像}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3001"
volumes:
  caddy_data:
  caddy_config:
